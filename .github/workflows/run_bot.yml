name: Run Nostr Ditto Bot

on:
  schedule:
    # تشغيل السكربت تلقائياً كل ساعتين
    - cron: '0 */2 * * *'
  workflow_dispatch: # يتيح لك تشغيله يدوياً بأي وقت

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install nostr-sdk requests

      - name: Execute Bot
        env:
          NOSTR_NSEC: ${{ secrets.NOSTR_NSEC }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python nostr_bot.py
